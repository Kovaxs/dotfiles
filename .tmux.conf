set-option -g history-limit 25000
set -g mouse on

# for neovim
set -sg escape-time 10
set-option -g focus-events on
set-option -g allow-passthrough on

# vi for copy mode
setw -g mode-keys vi

# pi compatibility
set -g extended-keys on
set -g extended-keys-format csi-u

# name pi windows as "π:<cwd>", nvim windows after nvim's titlestring ("ν:<file>|<cwd>")
# and shells as "β:<cwd>" instead of the raw process name; no spaces on purpose. The nvim
# branch also accepts the legacy "nvim: <file> · <dir>" title so pre-existing sessions
# still show their filename
set -g automatic-rename-format "#{?#{==:#{pane_current_command},node},π:#{b:pane_current_path},#{?#{==:#{pane_current_command},nvim},#{?#{m/r:^(ν|nvim),#{pane_title}},#{=26:pane_title},ν:|#{b:pane_current_path}},#{?#{m/r:^-?(bash|zsh|sh|fish|ksh|dash)$,#{pane_current_command}},β:#{b:pane_current_path},#{pane_current_command}}}}"


# status bar
set -g status-right "#(pomo)"
set -g status-style "fg=#665c54"
set -g status-left-style "fg=#928374"

set -g status-bg default
set -g status-position top
set -g status-interval 1
set -g status-left ""

# disable status
# set -g status off
set -g status on

# window list: highlight the current window instead of flagging it with "*"
# (the "*" came from #{window_flags} in tmux's default formats; we drop it)
# padding lives inside the format so the highlight wraps the whole name
set -g window-status-separator ""
set -g window-status-format "#[default] #[fg=#928374]#I #[fg=#a89984]#W #[default]"
set -g window-status-current-style "bg=#504945,fg=#ebdbb2,bold"
set -g window-status-current-format " #[fg=#fabd2f,bold]#I #[fg=#ebdbb2,bold]#W "

# count the panes from 1
set -g base-index 1
setw -g pane-base-index 1

# Keep new windows and panes in the active pane's directory (including jj workspaces)
bind-key c new-window -c '#{pane_current_path}'
bind-key '"' split-window -v -c '#{pane_current_path}'
bind-key % split-window -h -c '#{pane_current_path}'

# reload configuration
bind-key -r r source-file ~/.tmux.conf \; display-message "Config reloaded..."
#
bind-key -r f run-shell "tmux neww ~/bin/tmux-sessionizer"

# True color settings
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
# set-option -sa terminal-features ',bash:RGB'
# set -ga terminal-overrides ",tmux-256color:Tc"


# def key
unbind-key C-b
set-option -g prefix C-j
bind-key C-j send-prefix
